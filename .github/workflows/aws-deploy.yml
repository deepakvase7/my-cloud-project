name: Production AWS ECS Deploy

# 🚀 The Trigger: Runs automatically when application code changes
on:
  push:
    branches:
      - main
    paths:
      - 'app-services/python-service/**'

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app-services/python-service
          file: ./app-services/python-service/Dockerfile
          platforms: linux/amd64 # Forces cloud server compatibility
          push: true
          tags: dockervase/python-service:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1

      - name: Force AWS ECS Rolling Update
        run: |
          # Triggers Fargate to safely pull your fresh image with zero app downtime
          aws ecs update-service --cluster myorg-dev-cluster --service python-service --force-new-deployment
