name: Production AWS ECS Deploy

# 🚀 The Trigger: Runs automatically only when code inside your app folder changes
on:
  push:
    branches:
      - main
    paths:
      - 'app-services/python-service/**'

jobs:
  # JOB 1: Test and validate application code quality
  code-quality-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🟢 FIXED: Added dependency installation so your linter has context
      - name: Install Application and Linting Dependencies
        run: |
          pip install flake8 black
          pip install -r ./app-services/python-service/requirements.txt

      - name: Check Code Formatting
        run: |
          # Fails the pipeline if code style doesn't match standard best practices
          black --check ./app-services/python-service/app.py
          flake8 ./app-services/python-service/app.py --max-line-length=120

  # JOB 2: Compile, push container, and execute a rolling update to AWS
  build-and-ship:
    needs: code-quality-lint # Only runs if code quality checks pass successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🟢 FIXED: Adds multi-architecture execution simulation layers for secure building
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app-services/python-service
          file: ./app-services/python-service/Dockerfile
          platforms: linux/amd64 # Forces cloud server compatibility
          push: true
          tags: dockervase/python-service:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1

      - name: Force AWS ECS Rolling Update
        run: |
          # Triggers Fargate to safely pull your fresh image with zero app downtime
          aws ecs update-service --cluster myorg-dev-cluster --service python-service --force-new-deployment
